<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quick Snippet Launcher</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1e1e1e; color: #f0f0f0; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    input, textarea { width: 100%; box-sizing: border-box; background: #2d2d2d; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 6px; font-size: 1rem; margin-bottom: 10px; }
    input:focus { outline: 2px solid #0078d4; border-color: transparent; }
    .snippet { background: #252526; border: 1px solid #3c3c3c; padding: 12px; border-radius: 6px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .snippet.active { border-color: #0078d4; background: #2a2d2e; }
    .tag { background: #0078d4; color: #fff; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-right: 8px; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #107c10; color: white; padding: 10px 18px; border-radius: 6px; display: none; font-weight: bold; }
    details { margin-top: 2rem; border-top: 1px solid #333; padding-top: 1rem; }
    button { background: #0078d4; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <input type="text" id="search" placeholder="Type trigger or keyword (Press Enter to copy top match)..." autofocus>
  <div id="list"></div>

  <details>
    <summary style="cursor:pointer; color:#aaa;">+ Add / Manage Snippets</summary>
    <div style="margin-top: 10px;">
      <input type="text" id="newTrigger" placeholder="Short trigger (e.g., tls)">
      <input type="text" id="newTitle" placeholder="Title (e.g., Total Loss Settlement Note)">
      <textarea id="newBody" rows="4" placeholder="Snippet text..."></textarea>
      <button onclick="addSnippet()">Save Snippet</button>
    </div>
  </details>

  <div id="toast" class="toast">Copied to clipboard!</div>

  <script>
    const defaultSnippets = [
      { trigger: 'tls', title: 'Total Loss Settlement', body: 'Reviewed total loss valuation with owner. Settlement figures confirmed and title instructions provided.' },
      { trigger: 'poa', title: 'POA & Title Packet Sent', body: 'Mailed Power of Attorney and odometer disclosure packet to vehicle owner for signature.' }
    ];

    let snippets = JSON.parse(localStorage.getItem('work_snippets')) || defaultSnippets;
    const searchInput = document.getElementById('search');
    const listEl = document.getElementById('list');

    // Auto-focus search whenever you switch back to this browser tab/window
    window.addEventListener('focus', () => {
      searchInput.focus();
      searchInput.select();
    });

    function render(filter = '') {
      const q = filter.toLowerCase().trim();
      const filtered = snippets.filter(s =>
        s.trigger.toLowerCase().includes(q) ||
        s.title.toLowerCase().includes(q) ||
        s.body.toLowerCase().includes(q)
      );

      listEl.innerHTML = filtered.map((s, idx) => `
        <div class="snippet ${idx === 0 ? 'active' : ''}" onclick="copyText(${idx}, '${q}')">
          <div>
            <span class="tag">${s.trigger}</span>
            <strong>${s.title}</strong>
            <div style="color:#aaa; font-size:0.85rem; margin-top:4px;">${s.body}</div>
          </div>
          <span style="color:#888; font-size:0.8rem;">${idx === 0 ? '[Enter]' : 'Click'}</span>
        </div>
      `).join('');

      return filtered;
    }

    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (err) {
        // Fallback for restricted enterprise browsers or file:// protocol
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 1500);
    }

    function copyText(index, query) {
      const q = query.toLowerCase().trim();
      const filtered = snippets.filter(s =>
        s.trigger.toLowerCase().includes(q) ||
        s.title.toLowerCase().includes(q) ||
        s.body.toLowerCase().includes(q)
      );
      if (filtered[index]) copyToClipboard(filtered[index].body);
    }

    searchInput.addEventListener('input', (e) => render(e.target.value));
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        copyText(0, searchInput.value);
      }
    });

    function addSnippet() {
      const trigger = document.getElementById('newTrigger').value.trim();
      const title = document.getElementById('newTitle').value.trim();
      const body = document.getElementById('newBody').value.trim();
      if (!trigger || !body) return;
      snippets.push({ trigger, title: title || trigger, body });
      localStorage.setItem('work_snippets', JSON.stringify(snippets));
      document.getElementById('newTrigger').value = '';
      document.getElementById('newTitle').value = '';
      document.getElementById('newBody').value = '';
      render(searchInput.value);
    }

    render();
  </script>
</body>
</html>
